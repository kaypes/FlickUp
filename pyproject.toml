[project]
name = "flickup"
version = "0.1.0"
description = "GNOME video converter and Drive uploader"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pygobject>=3.56.3",
]

[project.scripts]
flickup = "flickup.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
